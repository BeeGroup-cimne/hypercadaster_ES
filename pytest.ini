[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra
filterwarnings =
    ignore:The 'shapely.geos' module is deprecated:DeprecationWarning
markers =
    live: end-to-end test that downloads real data over the network (deselected by default; enable with -m live or HC_RUN_LIVE=1)
